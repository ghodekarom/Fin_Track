# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, aligned to sys.path.insert(0, sys.argv[0])
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to copy to a migration script's filename
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be imported
# relative to the script location
# relative_imports = false

# version locations.  specifies where to find version files.
# Default is alembic/versions.  Separate multiple paths with semicolons.
# version_locations = %(here)s/alembic/versions

# version path separator; defaults to os.pathsep.
# Use os.pathsep to maintain compatibility with legacy versions
# version_path_separator = :

# set to 'true' to search source files for changes
# (runs slightly slower)
# search_type = recursive

sqlalchemy.url = postgresql://postgres:postgres@localhost/fintrack_db

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
